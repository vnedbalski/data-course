[project]
name = "data-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Uladzislau", email = "uladzislau.nedbalski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
